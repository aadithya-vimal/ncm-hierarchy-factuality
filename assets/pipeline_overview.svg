<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">NCM hierarchy factuality research pipeline</title><desc id="d">Official NCM XSum checkpoint creates all hierarchy-level reconstructions; sentence-level claims are assessed against source evidence, tracked between levels, analyzed and exported to Hugging Face.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607080"/></marker></defs>
<rect x="0" y="0" width="1200" height="500" rx="24" fill="#f7fafc"/>
<text x="40" y="48" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">From hierarchical generation to claim-lifecycle evidence</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="35" y="105" width="205" height="145" rx="15" fill="#e7f5f2" stroke="#0d9488" stroke-width="2"/><text x="55" y="139" font-size="17" font-weight="700" fill="#075e56">1 · NCM inference</text><text x="55" y="170" font-size="13" fill="#244047">Pinned code + XSum</text><text x="55" y="191" font-size="13" fill="#244047">released checkpoint</text><text x="55" y="221" font-size="13" fill="#244047">Capture every level once</text>
<path d="M240 178 L275 178" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="285" y="105" width="205" height="145" rx="15" fill="#e9efff" stroke="#4f66c9" stroke-width="2"/><text x="305" y="139" font-size="17" font-weight="700" fill="#263b8c">2 · Claims</text><text x="305" y="170" font-size="13" fill="#27365d">Deterministic sentence</text><text x="305" y="191" font-size="13" fill="#27365d">candidates + source</text><text x="305" y="212" font-size="13" fill="#27365d">evidence retrieval</text>
<path d="M490 178 L525 178" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="535" y="105" width="205" height="145" rx="15" fill="#fff2dc" stroke="#d97706" stroke-width="2"/><text x="555" y="139" font-size="17" font-weight="700" fill="#8f4700">3 · NLI evidence</text><text x="555" y="170" font-size="13" fill="#5c3e22">Supported / contradicted /</text><text x="555" y="191" font-size="13" fill="#5c3e22">unresolved probabilities</text><text x="555" y="221" font-size="13" fill="#5c3e22">Pair-score checkpointing</text>
<path d="M740 178 L775 178" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="785" y="105" width="180" height="145" rx="15" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="805" y="139" font-size="17" font-weight="700" fill="#5b21b6">4 · Lifecycles</text><text x="805" y="170" font-size="13" fill="#4c3973">TF-IDF + Hungarian</text><text x="805" y="191" font-size="13" fill="#4c3973">introduced / removed</text><text x="805" y="212" font-size="13" fill="#4c3973">label transitions</text>
<path d="M965 178 L1000 178" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1010" y="105" width="155" height="145" rx="15" fill="#e8f4ff" stroke="#0284c7" stroke-width="2"/><text x="1027" y="139" font-size="17" font-weight="700" fill="#075985">5 · Export</text><text x="1027" y="170" font-size="13" fill="#164e63">Metrics + figures</text><text x="1027" y="191" font-size="13" fill="#164e63">schema + hashes</text><text x="1027" y="221" font-size="13" fill="#164e63">Hub upload is opt-in</text>
<rect x="35" y="305" width="1130" height="130" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="340" font-size="16" font-weight="700" fill="#172b4d">Execution principle</text><text x="60" y="372" font-size="14" fill="#334155">One expensive NCM generation pass, protected by per-article transactions.</text><text x="60" y="396" font-size="14" fill="#334155">Annotation scores are cached; lifecycle analysis and plots reuse saved outputs.</text><text x="630" y="372" font-size="14" fill="#334155">Google Drive stores run state across Colab sessions.</text><text x="630" y="396" font-size="14" fill="#334155">No source article text is included in the public dataset export.</text>
</g></svg>