<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">NCM Research parent directory and repository separation</title><desc id="d">NCM Research is the parent folder, with independent github and huggingface repository roots, shared docs, local outputs and paper folders.</desc><rect width="1000" height="430" rx="20" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><rect x="300" y="22" width="400" height="64" rx="12" fill="#172b4d"/><text x="500" y="48" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">NCM Research/</text><text x="500" y="69" font-size="12" text-anchor="middle" fill="#dbeafe">Parent folder · not a Git repository</text><path d="M500 86 V116 H240 V140 M500 116 H760 V140" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M500 116 V275 H240 V300 M500 275 H760 V300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="55" y="140" width="370" height="110" rx="13" fill="#e0f2f1" stroke="#0d9488" stroke-width="2"/><text x="240" y="172" font-size="19" font-weight="700" text-anchor="middle" fill="#115e59">github/</text><text x="240" y="197" font-size="13" text-anchor="middle" fill="#134e4a">Independent Git root</text><text x="240" y="219" font-size="13" text-anchor="middle" fill="#134e4a">Code · notebooks · tests · docs</text><rect x="575" y="140" width="370" height="110" rx="13" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="760" y="172" font-size="19" font-weight="700" text-anchor="middle" fill="#5b21b6">huggingface/</text><text x="760" y="197" font-size="13" text-anchor="middle" fill="#4c1d95">Independent dataset repo root</text><text x="760" y="219" font-size="13" text-anchor="middle" fill="#4c1d95">Dataset card · data · schema · hashes</text><rect x="55" y="300" width="260" height="88" rx="11" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="185" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#92400e">docs/</text><text x="185" y="352" font-size="12" text-anchor="middle" fill="#78350f">Shared research protocol</text><rect x="370" y="300" width="260" height="88" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="500" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#334155">local_outputs/</text><text x="500" y="352" font-size="12" text-anchor="middle" fill="#475569">Private Drive run state</text><rect x="685" y="300" width="260" height="88" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="815" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#991b1b">paper/</text><text x="815" y="352" font-size="12" text-anchor="middle" fill="#7f1d1d">Write after experiments</text></g></svg>