<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Observable claim lifecycle across decoded NCM levels</title><desc id="d">At each adjacent pair of decoded hierarchy levels, candidate claims are matched; unmatched later claims are introduced and unmatched earlier claims removed. Matched claims can retain or change NLI status.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1000" height="470" rx="22" fill="#f8fafc"/><text x="36" y="42" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">Track claims between adjacent decoded levels</text><g font-family="Inter,Arial,sans-serif"><rect x="38" y="84" width="250" height="280" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="60" y="120" font-size="17" font-weight="700" fill="#075985">Level ℓ</text><rect x="61" y="145" width="202" height="48" rx="9" fill="#fff" stroke="#7dd3fc"/><text x="76" y="174" font-size="13" fill="#164e63">Claim A · supported</text><rect x="61" y="207" width="202" height="48" rx="9" fill="#fff" stroke="#7dd3fc"/><text x="76" y="236" font-size="13" fill="#164e63">Claim B · unresolved</text><rect x="61" y="269" width="202" height="48" rx="9" fill="#fff" stroke="#7dd3fc"/><text x="76" y="298" font-size="13" fill="#164e63">Claim C · contradicted</text>
<rect x="712" y="84" width="250" height="280" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="734" y="120" font-size="17" font-weight="700" fill="#5b21b6">Level ℓ + 1</text><rect x="735" y="145" width="202" height="48" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="750" y="174" font-size="13" fill="#4c1d95">Claim A′ · supported</text><rect x="735" y="207" width="202" height="48" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="750" y="236" font-size="13" fill="#4c1d95">Claim D · supported</text><rect x="735" y="269" width="202" height="48" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="750" y="298" font-size="13" fill="#4c1d95">Claim C′ · unresolved</text>
<path d="M288 169 C425 169,575 169,712 169" stroke="#0d9488" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M288 231 C425 231,575 231,712 293" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M288 293 C425 293,575 293,712 293" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M263 231 C375 340,610 365,735 231" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/><text x="360" y="130" font-size="12" fill="#0f766e">Matched + same label</text><text x="365" y="264" font-size="12" fill="#92400e">Matched + label changed</text><text x="380" y="350" font-size="12" fill="#6d28d9">New/removed candidates are unmatched</text>
<text x="40" y="414" font-size="13" fill="#475569">Matching is one-to-one TF-IDF cosine assignment with a predeclared threshold.</text><text x="40" y="438" font-size="13" fill="#475569">Labels are automated NLI judgments; transitions describe decoded texts, not proven internal causality.</text></g></svg>