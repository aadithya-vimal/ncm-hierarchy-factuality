[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-hierarchy-factuality"
version = "0.1.0"
description = "Reproducible analysis of factual-claim lifecycles across NCM hierarchy levels."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NCM Hierarchy Factuality contributors"}]
dependencies = [
  "numpy<2.0",
  "PyYAML>=6.0",
  "pandas>=2.1,<3",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "rouge-score>=0.1.2",
  "huggingface_hub>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
colab = [
  "torch",
  "omegaconf>=2.3",
  "hydra-core>=1.3.2",
  "transformers==4.51.3",
  "datasets==3.6.0",
  "sentencepiece>=0.2.0",
  "protobuf<6",
]

[project.scripts]
ncm-factuality-validate = "ncm_factuality.cli:main_validate"
ncm-factuality-publish = "ncm_factuality.huggingface_publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
